name: Build pinned AUREON integration candidate
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: distribution
      - name: Read reviewed source revision
        id: source
        working-directory: distribution
        run: |
          revision=$(cat SOURCE_COMMIT)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out exact AUREON source
        uses: actions/checkout@v5
        with:
          repository: thaianyboas/aureon-dashboard
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: source/floor-studio/neonplan3d-main/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate public source and frozen stable distribution
        working-directory: source
        run: npm run validate
      - name: Install exact source audit parser dependencies
        working-directory: source
        run: npm ci
      - name: Install exact frontend dependencies
        working-directory: source
        run: npm ci --prefix floor-studio/neonplan3d-main/frontend
      - name: Run frontend, module and publication gate tests
        working-directory: source
        run: |
          npm test
          python -m unittest discover -s floor-studio/tests -p 'test_*.py'
      - name: Rebuild and verify committed bundles
        working-directory: source
        run: |
          npm run build
          git diff --exit-code -- floor-studio/neonplan3d-main/custom_components/neonplan3d/frontend floor-studio/neonplan3d-main/site/import/neonplan-import.js
      - name: Validate music, platform pages, native editor and five-mode renderer without Home Assistant
        working-directory: source
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Install backend test dependencies
        working-directory: source/floor-studio/neonplan3d-main
        run: pip install -r requirements_test.txt
      - name: Run isolated backend tests (no installation)
        working-directory: source/floor-studio/neonplan3d-main
        run: pytest -q
      - name: Package and verify review candidate
        working-directory: source
        run: |
          node scripts/package-hacs-integration-candidate.mjs
          node scripts/verify-hacs-integration-candidate.mjs
          node scripts/check-neonplan-migration-contract.mjs
      - name: Committed package equals the package rebuilt from SOURCE_COMMIT
        run: |
          python3 - <<'PY'
          import json, sys
          committed = {f['path']: f['sha256'] for f in json.load(open('distribution/MANIFEST.json'))['files'] if f['path'].startswith('custom_components/')}
          rebuilt = {f['path']: f['sha256'] for f in json.load(open('source/build/neonplan3d-hacs-integration-candidate/MANIFEST.json'))['files'] if f['path'].startswith('custom_components/')}
          diff = sorted(p for p in set(committed) | set(rebuilt) if committed.get(p) != rebuilt.get(p))
          if diff:
              print('FAIL [reproducible package] the committed package differs from a fresh build of SOURCE_COMMIT:', *diff[:10], sep='\n  ')
              print('How to fix: repackage from that dashboard commit (scripts/package-hacs-integration-candidate.mjs) and copy the whole package.')
              sys.exit(1)
          print(f'PASS [reproducible package] {len(rebuilt)} files identical to a fresh build of SOURCE_COMMIT')
          PY
      - name: Record installation block
        run: echo 'Build candidate only. No Home Assistant runtime acceptance or HACS promotion. Stable v0.28.0 preserved.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: aureon-integration-candidate
          path: |
            source/build/neonplan3d-hacs-integration-candidate/
            source/build/music-browser/
            source/build/platform-browser/
            source/build/floor-browser/
            source/build/editor-browser/
          if-no-files-found: error
          retention-days: 14
