name: Validate AUREON integration distribution

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# a newer push supersedes a running validation of the same branch
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # pinned image: no surprise when ubuntu-latest moves to a new release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out integration distribution repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check workflow files are valid YAML
        run: |
          python -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path('.github').rglob('*.yml')):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'PASS [yaml] all workflow and config files parse')
          sys.exit(1 if bad else 0)
          PY
      - name: Validate distribution (structure, HACS metadata, manifest, source pin, checksums, secrets)
        run: python .github/scripts/validate_distribution.py
